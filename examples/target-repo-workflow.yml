# AI PR Review Loop — target repository workflow (PREVIEW).
#
# NOT YET EXECUTABLE END-TO-END: the orchestrator's runtime wiring
# (`_build_runtime_context`: GitHub client, git, coder, reviewer adapters) is a
# tracked follow-up and not implemented yet, so `aipro run` currently exits with
# "AI PR Orchestrator runner is not implemented yet." This template is provided so
# target repos can be configured ahead of that work; before it runs you will also
# need to install your coder CLI (see the "Set up the coder CLI" step) and keep
# `PATH` in the config's `main_coder.env`.
#
# Copy this file into your repository as `.github/workflows/ai-review-loop.yml`
# and copy `examples/sample-config.yml` to `.github/ai-review-loop.yml`.
#
# Required repository secrets:
#   AI_ORCHESTRATOR_GITHUB_TOKEN  (optional) a PAT/app token for the orchestrator.
#                                 Falls back to the workflow's GITHUB_TOKEN.
#   CODEX_API_KEY                 credential for the coder (passed only to the
#                                 coder subprocess, never the orchestrator token).
name: AI PR Review Loop

on:
  pull_request:
    # `labeled` lets adding the opt-in `ai-loop` label start the loop immediately,
    # rather than waiting for the next push or comment.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
        type: string

# Serialize runs per PR. Never cancel an in-flight run: the orchestrator holds an
# optimistic lock on its state comment, and cancelling mid-write can wedge state.
# Every term resolves to the PR number; the job-level `if` below guarantees the
# job only runs for events that have one, so no SHA fallback is needed.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number
      || github.event.issue.number
      || github.event.check_run.pull_requests[0].number
      || github.event.check_suite.pull_requests[0].number
      || inputs.pr }}
  cancel-in-progress: false

# Least-privilege scopes the runner actually uses:
#   contents: write        push commits to the PR branch
#   pull-requests: write   PR review comments, replies, and thread resolution
#   issues: write          issue-endpoint label add/remove and PR conversation
#                          comments (state comment, final summary)
#   checks: read           read check runs (Checks API) for the CI gate
#   statuses: read         read legacy commit statuses (CI that reports via the
#                          Commit Status API) for the CI gate
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  orchestrate:
    # Only run for events that map to a pull request. This skips comments on
    # plain (non-PR) issues and check events on branches without a PR, both of
    # which would otherwise spin up a runner the orchestrator can't act on (it
    # can't resolve a PR number and would exit with an error). Opt-in label
    # gating is enforced inside the orchestrator (safety.only_run_on_labeled_prs).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.number
      || github.event.issue.pull_request
      || github.event.check_run.pull_requests[0]
      || github.event.check_suite.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AI_ORCHESTRATOR_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install orchestrator
        # Pin to a released tag; replace YOUR_ORG with the org hosting this package.
        # For a PRIVATE orchestrator repo, authenticate the install with a token:
        #   run: pip install "git+https://x-access-token:${{ secrets.AI_ORCHESTRATOR_GITHUB_TOKEN }}@github.com/YOUR_ORG/ai-pr-orchestrator.git@v0.1.0"
        run: pip install git+https://github.com/YOUR_ORG/ai-pr-orchestrator.git@v0.1.0
      - name: Set up the coder CLI
        # The orchestrator invokes `main_coder.command` (codex in the sample
        # config) as a subprocess but does NOT install it. Replace this step with
        # the real install for your coder — e.g. an npm global install or a
        # release binary placed on PATH — and make sure `PATH` is listed in the
        # config's `main_coder.env` so the subprocess can find it. Until then the
        # coder phase fails with "command not found".
        run: echo "Replace this step with your coder CLI install (see comment)."
      - name: Run orchestrator
        # The orchestrator token (GH_TOKEN/GITHUB_TOKEN) authenticates GitHub API
        # calls. It is deliberately NOT listed in `main_coder.env` of the config,
        # and the coder adapter strips GH_TOKEN/GITHUB_TOKEN before spawning the
        # coder, so the coder never sees the orchestrator's credentials.
        env:
          GH_TOKEN: ${{ secrets.AI_ORCHESTRATOR_GITHUB_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.AI_ORCHESTRATOR_GITHUB_TOKEN || github.token }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: aipro run --event-path "$GITHUB_EVENT_PATH"
