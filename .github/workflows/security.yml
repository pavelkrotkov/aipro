name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --locked --all-extras --dev
      # pip-audit talks to PyPI; the scheduled run failed four weeks straight
      # on a transient ConnectionReset, so retry instead of paging a human.
      - run: |
          # Advisories are a security verdict, not a flake: retry only
          # transient PyPI/network errors, and never mask a vulnerability.
          for attempt in 1 2 3; do
            if out="$(uv run pip-audit 2>&1)"; then
              printf '%s\n' "$out"
              exit 0
            fi
            status=$?
            printf '%s\n' "$out"
            if ! grep -qiE 'connection (aborted|reset|refused)|remote end closed|timed out' <<<"$out"; then
              echo "pip-audit failed non-transiently; not retrying"
              exit "$status"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "transient failure on attempt $attempt; retrying in 30s"
              sleep 30
            fi
          done
          echo "pip-audit failed after 3 attempts"
          exit 1

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - run: pipx run zizmor .github/workflows
