name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --locked --all-extras --dev
      # pip-audit talks to PyPI; the scheduled run failed four weeks straight
      # on a transient ConnectionReset, so retry instead of paging a human.
      - run: |
          for attempt in 1 2 3; do
            if uv run pip-audit; then
              exit 0
            fi
            echo "pip-audit attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "pip-audit failed after 3 attempts"
          exit 1

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - run: pipx run zizmor .github/workflows
